{% extends "base.html" %}
{% block title %}Add custom field{% endblock %}
{% block content %}
<h1>Add custom field</h1>
<form method="post" action="/config/custom-fields" class="stacked">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <label for="entity">Entity</label>
  <select id="entity" name="entity">
    {% for e in entities %}<option value="{{ e.value }}" {% if form.entity == e.value %}selected{% endif %}>{{ e.value }}</option>{% endfor %}
  </select>
  <label for="name">Field name</label>
  <input type="text" id="name" name="name" value="{{ form.name or '' }}" aria-describedby="name-help" required>
  <span id="name-help" class="muted">Lowercase letters, digits and underscores. The key becomes &lt;entity&gt;.custom.&lt;name&gt;.</span>
  <label for="label">Label</label>
  <input type="text" id="label" name="label" value="{{ form.label or '' }}" required>
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="3">{{ form.description or '' }}</textarea>
  <label for="data_type">Data type</label>
  <select id="data_type" name="data_type">
    {% for t in data_types %}<option value="{{ t.value }}" {% if form.data_type == t.value %}selected{% endif %}>{{ t.value }}</option>{% endfor %}
  </select>
  <label><input type="checkbox" name="required" value="on" {% if form.required %}checked{% endif %}> Required</label>
  <label for="options">Options (enum only, one per line)</label>
  <textarea id="options" name="options" rows="4">{{ form.options or '' }}</textarea>
  <button type="submit">Create field</button>
</form>
{% endblock %}
