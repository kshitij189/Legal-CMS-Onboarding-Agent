services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lcms_dev_password}
      POSTGRES_DB: lcms
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lcms} -d lcms"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-cms:
    build: ./mock-cms
    environment:
      MOCK_CMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lcms}:${POSTGRES_PASSWORD:-lcms_dev_password}@postgres:5432/mock_cms
      MOCK_CMS_SEED_PASSWORD: ${MOCK_CMS_SEED_PASSWORD:-demo-password}
      # v2 renames some form controls (simulated vendor UI release) to demonstrate drift handling.
      MOCK_CMS_UI_VARIANT: ${MOCK_CMS_UI_VARIANT:-v1}
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    # Optional git-ignored secrets file (GEMINI_API_KEY, GROQ_API_KEY, ...).
    env_file:
      - path: .env
        required: false
    environment:
      ONBOARDING_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lcms}:${POSTGRES_PASSWORD:-lcms_dev_password}@postgres:5432/onboarding
      # Inside the Compose network the mock CMS is reached by service name.
      ONBOARDING_ALLOWED_CMS_ORIGINS: http://mock-cms:8100
      ONBOARDING_SEED_CMS_BASE_URL: http://mock-cms:8100
      ONBOARDING_ARTIFACTS_DIR: /srv/artifacts
      ONBOARDING_SEED_PASSWORD: ${ONBOARDING_SEED_PASSWORD:-demo-password}
      # Demo connector credentials: the mock CMS *integration* accounts (least privilege).
      ONBOARDING_SECRET_FIRM_A_MOCK_CMS_USERNAME: a.integration
      ONBOARDING_SECRET_FIRM_A_MOCK_CMS_PASSWORD: ${MOCK_CMS_SEED_PASSWORD:-demo-password}
      ONBOARDING_SECRET_FIRM_B_MOCK_CMS_USERNAME: b.integration
      ONBOARDING_SECRET_FIRM_B_MOCK_CMS_PASSWORD: ${MOCK_CMS_SEED_PASSWORD:-demo-password}
      ONBOARDING_SECRET_FIRM_C_MOCK_CMS_USERNAME: c.integration
      ONBOARDING_SECRET_FIRM_C_MOCK_CMS_PASSWORD: ${MOCK_CMS_SEED_PASSWORD:-demo-password}
      # Tracing: "none" by default; set OTEL_TRACES_EXPORTER=otlp and start the jaeger profile.
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: onboarding-backend
    ports:
      - "8200:8200"
    volumes:
      - ./artifacts:/srv/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      mock-cms:
        condition: service_started

  # Trace viewer, opt-in: docker compose --profile observability up -d jaeger
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP

volumes:
  pgdata:
