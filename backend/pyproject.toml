[project]
name = "onboarding-backend"
version = "0.1.0"
description = "Legal CMS onboarding & integration agent: backend API, domain logic and adapters."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "google-genai>=1.30,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra -m "not live_llm"'  # live LLM calls cost quota: run with -m live_llm
markers = [
    "live_cms: requires the mock CMS running at MOCK_CMS_BASE_URL with seeded demo data",
    "live_llm: calls real LLM providers (needs GEMINI_API_KEY/GROQ_API_KEY; costs quota)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["S", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
